# Builds an unsigned iOS app (.ipa) on a GitHub-hosted macOS runner.
# No Apple Developer account is needed: users sign the .ipa with their own
# free Apple ID when they sideload it (Sideloadly, AltStore or SideStore).
#
# Runs:
# - manually (Actions tab -> "iOS build" -> Run workflow): the .ipa is kept as a workflow artifact;
# - when a release is published: the .ipa is also attached to that release, next to the APK,
#   and the SideStore source (sidestore/source.json on main) gets the new version, so
#   SideStore users see it in My Apps -> Updates.
name: iOS build

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      ipa: ${{ steps.package.outputs.ipa }}
      version: ${{ steps.package.outputs.version }}
      size: ${{ steps.package.outputs.size }}
    defaults:
      run:
        working-directory: app
    steps:
      # Same layout as the local project: database repository at the root, app in app/.
      # The tests check that the app's copies of ui_copy.json and ui_config.json
      # match ../data/ in the database repository.
      - name: Check out the database
        uses: actions/checkout@v7
        with:
          repository: NunzioLangiulli/peak-season-database

      - name: Check out the app
        uses: actions/checkout@v7
        with:
          path: app

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run the tests
        run: flutter test

      # The Live Activity widget extension is added to the Xcode project here,
      # because without a Mac it cannot be added with Xcode (see the script).
      - name: Add the Live Activity extension to the Xcode project
        run: |
          gem install xcodeproj --no-document
          ruby ios/scripts/add_live_activity_target.rb

      - name: Build the iOS app (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Check that the Live Activity extension is inside the app
        run: test -d build/ios/iphoneos/Runner.app/PlugIns/PeakSeasonLiveActivity.appex

      - name: Package the .ipa
        id: package
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          IPA="PeakSeason-${VERSION}-unsigned.ipa"
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "$IPA" Payload
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -f%z "$IPA")" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA"

      - name: Keep the .ipa as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.ipa }}
          path: app/${{ steps.package.outputs.ipa }}
          if-no-files-found: error

      - name: Attach the .ipa to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.package.outputs.ipa }}" --clobber

  # Adds the released version to the SideStore/AltStore source on main.
  update-sidestore-source:
    needs: build-ios
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Add the new version to sidestore/source.json
        run: >
          python3 sidestore/update_source.py
          --version "${{ needs.build-ios.outputs.version }}"
          --tag "${{ github.event.release.tag_name }}"
          --ipa "${{ needs.build-ios.outputs.ipa }}"
          --size "${{ needs.build-ios.outputs.size }}"
          --date "${{ github.event.release.published_at }}"

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "The source already lists this version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidestore/source.json
          git commit -m "SideStore source: Peak Season ${{ needs.build-ios.outputs.version }}"
          git push origin HEAD:main
