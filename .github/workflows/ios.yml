# Builds an unsigned iOS app (.ipa) on a GitHub-hosted macOS runner.
# No Apple Developer account is needed: users sign the .ipa with their own
# free Apple ID when they sideload it (Sideloadly, AltStore or SideStore).
#
# Runs:
# - manually (Actions tab -> "iOS build" -> Run workflow): the .ipa is kept as a workflow artifact;
# - when a release is published: the .ipa is also attached to that release, next to the APK.
name: iOS build

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      # Same layout as the local project: database repository at the root, app in app/.
      # The tests check that the app's copies of ui_copy.json and ui_config.json
      # match ../data/ in the database repository.
      - name: Check out the database
        uses: actions/checkout@v5
        with:
          repository: NunzioLangiulli/peak-season-database

      - name: Check out the app
        uses: actions/checkout@v5
        with:
          path: app

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run the tests
        run: flutter test

      - name: Build the iOS app (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package the .ipa
        id: package
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          IPA="PeakSeason-${VERSION}-unsigned.ipa"
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "$IPA" Payload
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA"

      - name: Keep the .ipa as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ipa }}
          path: app/${{ steps.package.outputs.ipa }}
          if-no-files-found: error

      - name: Attach the .ipa to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.package.outputs.ipa }}" --clobber
